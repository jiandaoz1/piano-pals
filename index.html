<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Piano Pals 🎹</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🎹%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="clouds" aria-hidden="true"><span>☁️</span><span>☁️</span><span>☁️</span></div>

    <section id="welcome" class="screen active">
      <div class="big-mascot">🐻</div>
      <h1>Piano Pals</h1>
      <p class="lead">I will listen while you play the notes!</p>
      <button id="start" class="btn primary huge">🎤 Let's play!</button>
      <p id="mic-error" class="error" hidden></p>
    </section>

    <section id="menu" class="screen">
      <header class="bar">
        <h2>Pick a level</h2>
        <button id="open-calib" class="btn small">🎤 Mic check</button>
      </header>
      <div id="levels"></div>
      <div id="songs"></div>
    </section>

    <section id="calib" class="screen">
      <header class="bar">
        <button class="btn small back">⬅ Back</button>
        <h2>Mic check</h2>
      </header>
      <p class="lead">Play any key on the piano. I should see a letter!</p>
      <div class="meter"><div id="meter-fill"></div></div>
      <div id="heard" class="heard">…</div>
      <p class="small-text">If the piano is a little out of tune, play a key and tap the button so I can adjust.</p>
      <div class="row">
        <button id="tune-btn" class="btn">🎯 Match my piano</button>
        <button id="tune-reset" class="btn">↺ Reset</button>
      </div>
      <p id="tune-info" class="small-text"></p>
    </section>

    <section id="game" class="screen">
      <header class="bar">
        <button class="btn small back">⬅ Songs</button>
        <h2 id="song-title"></h2>
        <div class="row">
          <button id="hear" class="btn small">🔊 Hear it</button>
          <button id="metro" class="btn small">🥁 Beat <span id="bpm">70</span></button>
          <button id="metro-down" class="btn small">−</button><button id="metro-up" class="btn small">+</button>
          <button id="toggle-letters" class="btn small">🔤 Letters</button>
        </div>
      </header>
      <div class="progress"><div id="progress-fill"></div></div>
      <canvas id="lane"></canvas>
      <div class="mascot-row">
        <div id="mascot" class="mascot">🐻</div>
        <div id="bubble" class="bubble">Play the glowing note!</div>
      </div>
      <canvas id="keys"></canvas>
    </section>

    <div id="done" class="overlay" hidden>
      <div class="card">
        <div class="big-mascot">🎉</div>
        <h2>Great job!</h2>
        <div id="stars" class="stars"></div>
        <div class="row">
          <button id="again" class="btn">🔁 Again</button>
          <button id="next" class="btn primary">➡ Next song</button>
          <button id="to-menu" class="btn">🏠 Songs</button>
        </div>
      </div>
    </div>

    <script type="module" src="src/ui/app.js"></script>
  </body>
</html>
